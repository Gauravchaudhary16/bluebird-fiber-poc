trigger:
  branches:
    include:
      - main
      - development

pool:
  vmImage: 'ubuntu-latest'

variables:
  MULE_USERNAME: $(MULE_USERNAME)  # Set in pipeline variables or Azure Key Vault
  MULE_PASSWORD: $(MULE_PASSWORD)

stages:
  - stage: Build
    displayName: 'Build Stage'
    jobs:
      - job: BuildJob
        displayName: 'Build Job'
        steps:
          - task: Maven@3
            displayName: 'Maven Clean Package'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package'
              options: '-B'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'

  - stage: Deploy
    displayName: 'Deploy Stage'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Mule Environment'
        environment: ${{ if eq(variables['Build.SourceBranchName'], 'main') }}prod${{ else }}dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    mvn mule:deploy \
                      -DmuleDeploy.username=$(MULE_USERNAME) \
                      -DmuleDeploy.password=$(MULE_PASSWORD) \
                      -DmuleDeploy.environment=${{ if eq(variables['Build.SourceBranchName'], 'main') }}prod${{ else }}dev
                  displayName: 'Deploy Mule Application'
